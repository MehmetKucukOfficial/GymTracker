name: Android production release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-production-release
  cancel-in-progress: false

jobs:
  signed-release:
    name: Signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Materialize upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.GYMTRACKER_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$UPLOAD_KEYSTORE_BASE64"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gymtracker-upload.jks"
          chmod 600 "$RUNNER_TEMP/gymtracker-upload.jks"

      - name: Build and verify signed release artifacts
        env:
          GYMTRACKER_UPLOAD_STORE_FILE: ${{ runner.temp }}/gymtracker-upload.jks
          GYMTRACKER_UPLOAD_STORE_PASSWORD: ${{ secrets.GYMTRACKER_UPLOAD_STORE_PASSWORD }}
          GYMTRACKER_UPLOAD_KEY_ALIAS: ${{ secrets.GYMTRACKER_UPLOAD_KEY_ALIAS }}
          GYMTRACKER_UPLOAD_KEY_PASSWORD: ${{ secrets.GYMTRACKER_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :app:releaseDistribution --no-daemon --max-workers=2 --stacktrace

      - name: Upload verified production artifacts
        uses: actions/upload-artifact@v7
        with:
          name: production-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14

      - name: Remove upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/gymtracker-upload.jks"
